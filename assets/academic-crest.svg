<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="crest-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002fa7"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <!-- Outer Ring -->
  <circle cx="60" cy="60" r="54" fill="none" stroke="#002fa7" stroke-width="2" opacity="0.8"/>
  <circle cx="60" cy="60" r="48" fill="none" stroke="#ea580c" stroke-width="1" stroke-dasharray="4 3" opacity="0.7"/>
  
  <!-- Scales of Justice & Digital Lattice -->
  <line x1="60" y1="28" x2="60" y2="88" stroke="#002fa7" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="36" y1="42" x2="84" y2="42" stroke="#002fa7" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="60" cy="42" r="3.5" fill="#ea580c"/>

  <!-- Left Scale Pan -->
  <line x1="36" y1="42" x2="28" y2="62" stroke="#64748b" stroke-width="1.2"/>
  <line x1="36" y1="42" x2="44" y2="62" stroke="#64748b" stroke-width="1.2"/>
  <path d="M25 62 Q36 72 47 62 Z" fill="#002fa7" opacity="0.85"/>

  <!-- Right Scale Pan -->
  <line x1="84" y1="42" x2="76" y2="62" stroke="#64748b" stroke-width="1.2"/>
  <line x1="84" y1="42" x2="92" y2="62" stroke="#64748b" stroke-width="1.2"/>
  <path d="M73 62 Q84 72 95 62 Z" fill="#002fa7" opacity="0.85"/>

  <!-- Base -->
  <rect x="48" y="88" width="24" height="4" rx="2" fill="#002fa7"/>

  <!-- Latin Inscription Circular Arc (JURISPRUDENTIA) -->
  <text x="60" y="20" font-family="'Noto Serif SC', serif" font-size="6.5" font-weight="bold" fill="#002fa7" text-anchor="middle" letter-spacing="1.5">VERITAS · IUSTITIA</text>
  <text x="60" y="106" font-family="'Noto Serif SC', serif" font-size="6" font-weight="600" fill="#ea580c" text-anchor="middle" letter-spacing="1">INSTITUTE FOR LAW</text>
</svg>
