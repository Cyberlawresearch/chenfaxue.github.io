<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="emblem-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Tech Ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#emblem-grad)" stroke-width="2.5" stroke-dasharray="8 6"/>
  <circle cx="100" cy="100" r="76" fill="rgba(2,132,199,0.03)" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Legal Scales Beam (Modern Minimalist) -->
  <line x1="100" y1="45" x2="100" y2="145" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
  <line x1="55" y1="65" x2="145" y2="65" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>

  <!-- Center Fulcrum -->
  <circle cx="100" cy="65" r="5" fill="#0284c7"/>

  <!-- Left Scale (AI / Data Nodes) -->
  <line x1="55" y1="65" x2="40" y2="100" stroke="#64748b" stroke-width="1.5"/>
  <line x1="55" y1="65" x2="70" y2="100" stroke="#64748b" stroke-width="1.5"/>
  <path d="M35 100 Q55 120 75 100 Z" fill="url(#emblem-grad)" opacity="0.85"/>
  
  <!-- Right Scale (Human Rights / Justice Book) -->
  <line x1="145" y1="65" x2="130" y2="100" stroke="#64748b" stroke-width="1.5"/>
  <line x1="145" y1="65" x2="160" y2="100" stroke="#64748b" stroke-width="1.5"/>
  <path d="M125 100 Q145 120 165 100 Z" fill="url(#emblem-grad)" opacity="0.85"/>

  <!-- Base of Justice Column -->
  <path d="M80 145 L120 145 L130 155 L70 155 Z" fill="#0f172a"/>
</svg>
