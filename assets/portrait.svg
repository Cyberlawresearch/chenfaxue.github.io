<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" width="100%" height="100%">
  <defs>
    <!-- Klein Blue & Warm Orange Studio Lighting -->
    <radialGradient id="academic-studio" cx="50%" cy="36%" r="68%">
      <stop offset="0%" stop-color="#fdfcf9"/>
      <stop offset="55%" stop-color="#f0eee6"/>
      <stop offset="100%" stop-color="#ded8ca"/>
    </radialGradient>

    <!-- Obsidian & Klein Navy Suit Palette -->
    <linearGradient id="bespoke-suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="60%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>

    <!-- Natural Academic Skin Tone -->
    <linearGradient id="skin-warm" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#fdf7f0"/>
      <stop offset="60%" stop-color="#f3e5d5"/>
      <stop offset="100%" stop-color="#dfc9b4"/>
    </linearGradient>

    <!-- Klein Blue Silk Tie -->
    <linearGradient id="klein-silk-tie" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#002fa7"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>

    <!-- Terracotta Orange Pocket Square Accent -->
    <linearGradient id="orange-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <filter id="portrait-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#111827" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="600" height="780" fill="url(#academic-studio)"/>

  <!-- Subtle Architecture / Law Library Arch in Background -->
  <path d="M120 780 L120 280 C120 180, 480 180, 480 280 L480 780" fill="none" stroke="#d4d0c4" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="300" cy="200" r="40" fill="none" stroke="#002fa7" stroke-width="1" opacity="0.15"/>

  <!-- Scholar Portrait Group -->
  <g filter="url(#portrait-shadow)">
    <!-- Charcoal/Midnight Navy Suit -->
    <path d="M70 780 C88 590, 175 505, 300 505 C425 505, 512 590, 530 780 Z" fill="url(#bespoke-suit)"/>
    
    <!-- White Oxford Shirt Collar -->
    <polygon points="300,505 232,468 260,562 300,590" fill="#ffffff"/>
    <polygon points="300,505 368,468 340,562 300,590" fill="#f9fafb"/>
    <polygon points="300,505 270,556 330,556" fill="#e5e7eb"/>

    <!-- Klein Blue Silk Tie -->
    <polygon points="288,542 312,542 320,740 300,770 280,740" fill="url(#klein-silk-tie)"/>
    <polygon points="286,536 314,536 308,570 292,570" fill="#002fa7"/>

    <!-- Terracotta Orange Pocket Square Accent -->
    <polygon points="205,620 220,600 230,620" fill="url(#orange-accent)"/>
    <line x1="195" y1="622" x2="238" y2="622" stroke="#4b5563" stroke-width="2"/>

    <!-- Lapels -->
    <path d="M208 510 L264 645 L218 780" stroke="#374151" stroke-width="2.5" fill="none"/>
    <path d="M392 510 L336 645 L382 780" stroke="#374151" stroke-width="2.5" fill="none"/>

    <!-- Neck with natural shadow -->
    <rect x="264" y="415" width="72" height="80" rx="8" fill="url(#skin-warm)"/>
    <path d="M264 450 C280 475, 320 475, 336 450 Z" fill="#d2bba3" opacity="0.45"/>

    <!-- Head / Face Silhouette -->
    <path d="M228 290 C228 192, 372 192, 372 290 C372 380, 344 435, 300 435 C256 435, 228 380, 228 290 Z" fill="url(#skin-warm)"/>

    <!-- Distinguished Scholar Hair -->
    <path d="M222 280 C222 172, 305 162, 376 192 C386 235, 380 280, 380 280 C380 280, 366 202, 300 202 C238 202, 232 250, 222 280 Z" fill="#111827"/>
    <path d="M222 258 C226 210, 254 180, 300 178 C350 178, 378 200, 382 248 C356 208, 310 198, 252 214 Z" fill="#1f2937"/>

    <!-- Titanium Glasses Frame -->
    <g stroke="#111827" stroke-width="2.2" fill="none" opacity="0.95">
      <rect x="244" y="280" width="45" height="30" rx="5" fill="rgba(255,255,255,0.45)"/>
      <rect x="311" y="280" width="45" height="30" rx="5" fill="rgba(255,255,255,0.45)"/>
      <line x1="289" y1="290" x2="311" y2="290"/>
      <line x1="244" y1="290" x2="232" y2="284"/>
      <line x1="356" y1="290" x2="368" y2="284"/>
    </g>

    <!-- Klein Blue Lapel Badge / Academic Pin -->
    <circle cx="212" cy="605" r="3.5" fill="#002fa7"/>
  </g>
</svg>
