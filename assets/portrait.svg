<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <!-- Warm academic studio lighting background -->
    <linearGradient id="studio-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Professional suit palette -->
    <linearGradient id="suit-fabric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Academic tie palette -->
    <linearGradient id="academic-tie" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Natural skin tone -->
    <linearGradient id="natural-skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4eb"/>
      <stop offset="70%" stop-color="#fae8d4"/>
      <stop offset="100%" stop-color="#ebd2bc"/>
    </linearGradient>

    <filter id="natural-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="750" fill="url(#studio-bg)" rx="16"/>

  <!-- Subtle bookshelf shadow motif in background (soft, atmospheric) -->
  <g opacity="0.12" fill="#475569">
    <rect x="40" y="80" width="16" height="580" rx="4"/>
    <rect x="62" y="120" width="14" height="540" rx="3"/>
    <rect x="82" y="100" width="18" height="560" rx="4"/>
    <rect x="490" y="90" width="18" height="570" rx="4"/>
    <rect x="514" y="130" width="14" height="530" rx="3"/>
    <rect x="534" y="110" width="20" height="550" rx="4"/>
  </g>

  <!-- Scholar Silhouette & Presentation -->
  <g filter="url(#natural-shadow)">
    <!-- Shoulders & Dark Navy Suit -->
    <path d="M100 750 C110 570, 190 490, 300 490 C410 490, 490 570, 500 750 Z" fill="url(#suit-fabric)"/>
    
    <!-- White Crisp Shirt -->
    <polygon points="300,490 240,460 265,545 300,570" fill="#ffffff"/>
    <polygon points="300,490 360,460 335,545 300,570" fill="#f8fafc"/>
    <polygon points="300,490 275,540 325,540" fill="#f1f5f9"/>

    <!-- Academic Navy Blue Tie -->
    <polygon points="290,530 310,530 318,710 300,735 282,710" fill="url(#academic-tie)"/>
    <polygon points="288,525 312,525 308,555 292,555" fill="#1e3a8a"/>

    <!-- Suit Lapels -->
    <path d="M220 495 L268 620 L230 750" stroke="#334155" stroke-width="2.5" fill="none"/>
    <path d="M380 495 L332 620 L370 750" stroke="#334155" stroke-width="2.5" fill="none"/>

    <!-- Neck -->
    <rect x="268" y="400" width="64" height="75" rx="8" fill="url(#natural-skin)"/>
    <path d="M268 440 C280 460, 320 460, 332 440 Z" fill="#e2b998" opacity="0.4"/>

    <!-- Head / Jaw / Face -->
    <path d="M235 280 C235 190, 365 190, 365 280 C365 365, 340 420, 300 420 C260 420, 235 365, 235 280 Z" fill="url(#natural-skin)"/>

    <!-- Scholar Hair (Neat & Distinguished) -->
    <path d="M230 270 C230 170, 305 160, 370 190 C378 230, 372 270, 372 270 C372 270, 360 200, 300 200 C245 200, 240 245, 230 270 Z" fill="#1e293b"/>
    <path d="M230 250 C234 205, 260 178, 300 175 C345 175, 372 195, 375 240 C352 205, 310 195, 258 210 Z" fill="#0f172a"/>

    <!-- Titanium Glasses (Clean Academic Wireframe) -->
    <g stroke="#334155" stroke-width="2.2" fill="none" opacity="0.95">
      <!-- Left Rim -->
      <rect x="250" y="272" width="40" height="28" rx="6" fill="rgba(255,255,255,0.45)"/>
      <!-- Right Rim -->
      <rect x="310" y="272" width="40" height="28" rx="6" fill="rgba(255,255,255,0.45)"/>
      <!-- Bridge -->
      <line x1="290" y1="282" x2="310" y2="282"/>
      <!-- Temples -->
      <line x1="250" y1="282" x2="238" y2="276"/>
      <line x1="350" y1="282" x2="362" y2="276"/>
    </g>

    <!-- Refined lapel pin / badge -->
    <circle cx="225" cy="600" r="3.5" fill="#94a3b8"/>
  </g>
</svg>
