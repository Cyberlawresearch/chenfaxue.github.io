<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 220" width="100%" height="100%">
  <defs>
    <linearGradient id="book1-cover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002fa7"/>
      <stop offset="70%" stop-color="#001d66"/>
      <stop offset="100%" stop-color="#0a1128"/>
    </linearGradient>
    <linearGradient id="spine-shadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.4)"/>
      <stop offset="25%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.1)"/>
    </linearGradient>
    <linearGradient id="gold-foil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <!-- Book Base -->
  <rect width="160" height="220" fill="url(#book1-cover)" rx="4"/>

  <!-- Left Spine Realistic 3D Lighting -->
  <rect x="0" y="0" width="16" height="220" fill="url(#spine-shadow)"/>
  <line x1="16" y1="0" x2="16" y2="220" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Inner Gold/Orange Frame Line -->
  <rect x="24" y="16" width="120" height="188" fill="none" stroke="url(#gold-foil)" stroke-width="1" opacity="0.6"/>

  <!-- Series Tag -->
  <text x="84" y="38" font-family="'Noto Serif SC', serif" font-size="7.5" fill="#fef08a" text-anchor="middle" letter-spacing="1">数字法治前沿文库</text>

  <!-- Title in Gold / White -->
  <text x="84" y="70" font-family="'Noto Serif SC', serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">数字法学导论</text>
  <text x="84" y="88" font-family="'Noto Serif SC', serif" font-size="8" fill="#e2e8f0" text-anchor="middle" opacity="0.9">理论范式与制度构建</text>

  <!-- Law Scale Geometric Emblem -->
  <g transform="translate(84, 125) scale(0.6)" stroke="#fef08a" stroke-width="1.5" fill="none" opacity="0.8">
    <line x1="0" y1="-20" x2="0" y2="20"/>
    <line x1="-25" y1="-10" x2="25" y2="-10"/>
    <path d="M-30 5 Q-25 15 -20 5 Z" fill="#fef08a"/>
    <path d="M20 5 Q25 15 30 5 Z" fill="#fef08a"/>
    <circle cx="0" cy="-10" r="3" fill="#fef08a"/>
  </g>

  <!-- Author Name -->
  <text x="84" y="172" font-family="'Noto Serif SC', serif" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="600">陈法学 著</text>

  <!-- Publisher Seal -->
  <text x="84" y="194" font-family="'Noto Serif SC', serif" font-size="6.5" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">法律出版社</text>
</svg>
