<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Klein Blue Radial Base -->
    <linearGradient id="emblem-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002fa7"/>
      <stop offset="60%" stop-color="#002280"/>
      <stop offset="100%" stop-color="#001659"/>
    </linearGradient>

    <!-- Warm Gold & Platinum Metallic Sheen -->
    <linearGradient id="gold-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <linearGradient id="warm-accent-pip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Klein Blue Emblem Shield / Rounded Square -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#emblem-base)"/>
  <rect x="3.5" y="3.5" width="57" height="57" rx="12.5" fill="none" stroke="url(#gold-metal)" stroke-width="1.2" opacity="0.8"/>
  <rect x="5.5" y="5.5" width="53" height="53" rx="10.5" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="0.75" stroke-dasharray="3 2"/>

  <!-- SCALES OF JUSTICE (Fine Art Vector) -->
  <g filter="url(#glow)">
    <!-- Central Pillar -->
    <line x1="32" y1="12" x2="32" y2="48" stroke="url(#gold-metal)" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Top Finial / Ring of Justice -->
    <circle cx="32" cy="12" r="3.5" fill="none" stroke="url(#gold-metal)" stroke-width="1.8"/>
    <circle cx="32" cy="12" r="1.5" fill="url(#warm-accent-pip)"/>

    <!-- Balance Crossbeam (Main horizontal arm) -->
    <path d="M14 20 Q32 17 50 20" fill="none" stroke="url(#gold-metal)" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="32" cy="19" r="3" fill="url(#gold-metal)"/>
    <circle cx="32" cy="19" r="1.5" fill="#002fa7"/>

    <!-- Left Balance Chains & Pan -->
    <line x1="15" y1="20" x2="9" y2="34" stroke="url(#gold-metal)" stroke-width="1.2" opacity="0.95"/>
    <line x1="15" y1="20" x2="21" y2="34" stroke="url(#gold-metal)" stroke-width="1.2" opacity="0.95"/>
    <line x1="15" y1="20" x2="15" y2="34" stroke="url(#gold-metal)" stroke-width="0.8" opacity="0.7"/>
    <path d="M7 34 Q15 41 23 34 Z" fill="url(#gold-metal)"/>
    <ellipse cx="15" cy="34" rx="8" ry="1.8" fill="#fef08a" opacity="0.8"/>

    <!-- Right Balance Chains & Pan -->
    <line x1="49" y1="20" x2="43" y2="34" stroke="url(#gold-metal)" stroke-width="1.2" opacity="0.95"/>
    <line x1="49" y1="20" x2="55" y2="34" stroke="url(#gold-metal)" stroke-width="1.2" opacity="0.95"/>
    <line x1="49" y1="20" x2="49" y2="34" stroke="url(#gold-metal)" stroke-width="0.8" opacity="0.7"/>
    <path d="M41 34 Q49 41 57 34 Z" fill="url(#gold-metal)"/>
    <ellipse cx="49" cy="34" rx="8" ry="1.8" fill="#fef08a" opacity="0.8"/>

    <!-- Pedestal Base (Double Tier) -->
    <rect x="22" y="47" width="20" height="3" rx="1.5" fill="url(#gold-metal)"/>
    <path d="M20 50 L44 50 L46 53 L18 53 Z" fill="url(#gold-metal)"/>
  </g>
</svg>
